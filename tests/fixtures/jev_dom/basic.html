<!doctype html><html><head><title>Fixture</title><style>body{margin:0;font:14px sans-serif}.row{height:40px}.spacer{height:700px}#cover{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.1);display:none}.field{position:relative;width:300px;height:40px;margin:4px 0}.trigger{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border:1px solid #888;background:#fff;padding:0 12px;line-height:38px;font:14px sans-serif}.flabel{position:absolute;left:8px;right:8px;top:4px;bottom:4px;background:#fff;line-height:32px}#panel{position:absolute;width:320px;background:#fff;border:1px solid #444}#panel div{height:40px}</style></head><body>
<h1>Shop</h1>
<div class="row" id="r1"><span>Apple pie</span> <button>Add</button></div>
<div class="row" id="r2"><span>Banana bread</span> <button>Add</button></div>
<div class="row"><button disabled>Checkout</button></div>
<div class="row"><label for="q">Search</label><input id="q" type="text"></div>
<div class="row"><label for="s">Size</label><select id="s"><option value="s">Small</option><option value="l">Large</option></select></div>
<div class="row"><input type="password" aria-label="Secret"><input type="hidden" name="h" value="x"><input type="file" aria-label="Upload"></div>
<div class="row"><button aria-hidden="true">Ghost</button></div>
<div class="row"><button id="cov">Covered</button></div>
<div class="row"><x-search id="xs"></x-search></div>
<div class="row"><button id="ask" onclick="document.title = confirm('Really?') ? 'confirmed' : 'declined'; alert('done asking')">Ask</button></div>
<!-- Outlined fields drawn the way Material-style design systems draw them: the
     label lies across the middle of the control and is not inside it. -->
<div class="field"><div role="combobox" id="hq" tabindex="0" aria-label="Headquarters" aria-expanded="false" class="trigger"></div><span class="flabel">Where is your business headquartered *</span></div>
<div class="field"><input id="uc" class="trigger" aria-label="Use cases"><span class="flabel">What are your intended use cases *</span></div>
<script>
// A select that opens its options in a panel at the end of the page, on a
// press (mousedown) or Enter, like the Google Cloud console's selects.
(function () {
  var hq = document.getElementById('hq'), panel = null;
  function close() { if (panel) { panel.remove(); panel = null; hq.setAttribute('aria-expanded', 'false'); } }
  function open() {
    if (panel) return;
    var r = hq.getBoundingClientRect();
    panel = document.createElement('div');
    panel.id = 'panel'; panel.setAttribute('role', 'listbox');
    panel.style.left = (r.left + window.scrollX) + 'px';
    panel.style.top = (r.bottom + window.scrollY) + 'px';
    ['United States of America', 'Canada', 'Mexico'].forEach(function (t) {
      var o = document.createElement('div');
      o.setAttribute('role', 'option'); o.textContent = t;
      o.addEventListener('click', function () { hq.textContent = t; close(); });
      panel.appendChild(o);
    });
    document.body.appendChild(panel);
    hq.setAttribute('aria-expanded', 'true');
  }
  hq.addEventListener('mousedown', function (e) { e.preventDefault(); open(); });
  hq.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
// A web component whose controls live in an open shadow root (MDN, GitHub and
// many design systems ship search boxes and buttons like this).
customElements.define('x-search', class extends HTMLElement {
  constructor() {
    super();
    var r = this.attachShadow({ mode: 'open' });
    r.innerHTML = '<span id="lbl">Find docs</span><input id="in" aria-labelledby="lbl" type="search">' +
      '<button id="go">Go</button><p>Shadow text here</p>';
    r.getElementById('go').addEventListener('click', function () { document.title = 'went:' + r.getElementById('in').value; });
  }
});
</script>
<div class="spacer"></div>
<button id="far">Far away</button>
<div style="height:5000px"></div><button id="way">Way far</button>
<div id="cover"></div>
</body></html>
