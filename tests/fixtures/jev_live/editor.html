<!doctype html><html><head><meta charset="utf-8"><title>New post</title><link rel="stylesheet" href="style.css">
<style>.ed{min-height:120px;border:1px solid #b9c2d0;border-radius:6px;padding:10px;background:#fff}</style></head>
<body><header><span class="brand">Acme Cloud</span><a href="index.html">Home</a></header>
<main><h1>New post</h1><div class="card">
<label for="title">Title</label><input id="title" type="text">
<label id="bl">Body</label><div class="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="bl" id="body"></div>
<div style="margin-top:12px"><button type="button" id="draft">Save draft</button> <span id="st" class="muted"></span></div></div></main>
<script src="harness.js"></script>
<script>
var body = document.getElementById('body'), model = '';
// Editors keep their own model and update it from input events, ignoring raw DOM edits.
body.addEventListener('beforeinput', function (e) { if (e.inputType === 'insertText' || e.inputType === 'insertReplacementText') { /* accepted */ } });
body.addEventListener('input', function () { model = body.innerText; });
document.getElementById('draft').addEventListener('click', function () { H.log('save-post', { title: document.getElementById('title').value, body: model }); document.getElementById('st').textContent = 'Draft saved.'; });
</script></body></html>
