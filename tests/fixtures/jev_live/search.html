<!doctype html><html><head><meta charset="utf-8"><title>Search results</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="brand">Acme Cloud</span><a href="index.html">Home</a></header>
<main><h1 id="h"></h1><div id="results"></div></main>
<script src="harness.js"></script>
<script>
var DOCS = [
  ['k8s-quickstart', 'Kubernetes quickstart', 'Create a cluster and deploy your first workload in ten minutes.'],
  ['k8s-autoscaling', 'Kubernetes autoscaling', 'Scale node pools and pods with the horizontal autoscaler.'],
  ['kafka', 'Kafka connectors', 'Stream change data into managed Kafka topics.'],
  ['pg-backups', 'Postgres backups', 'Point-in-time recovery for managed Postgres.'],
  ['api-limits', 'API rate limits', 'Request quotas per project and how to raise them.'],
  ['iam', 'IAM roles', 'Grant least-privilege access to your team.'],
];
var q = (new URLSearchParams(location.search).get('q') || '').trim();
document.getElementById('h').textContent = 'Results for "' + q + '"';
var hits = DOCS.filter(function (d) { return (d[1] + ' ' + d[2]).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
var box = document.getElementById('results');
if (!hits.length) box.innerHTML = '<p>No results.</p>';
hits.forEach(function (d) {
  var c = document.createElement('div'); c.className = 'card';
  c.innerHTML = '<a href="doc.html?id=' + d[0] + '">' + d[1] + '</a><p class="muted">' + d[2] + '</p>';
  box.appendChild(c);
});
H.log('results', { q: q, n: hits.length });
</script></body></html>
