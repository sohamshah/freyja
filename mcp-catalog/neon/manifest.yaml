# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Adapted from hermes-agent optional-mcps/neon/manifest.yaml
# (Copyright (c) 2025 Nous Research, MIT License). URL/pins re-verified for
# Freyja on the `verified` date below.
manifest_version: 1

name: neon
description: 'Neon serverless Postgres: projects, branches, and SQL.'
homepage: https://neon.com/docs/ai/neon-mcp-server
license: proprietary
verified: 2026-09-03
tags: [database, postgres, remote, oauth]

# Official hosted remote MCP, native OAuth 2.1 + DCR (RFC 9728 metadata ->
# AS metadata with registration_endpoint). Verified live: 401 +
# resource_metadata=https://mcp.neon.tech/.well-known/oauth-protected-resource
transport:
  type: http
  url: https://mcp.neon.tech/mcp

auth:
  type: oauth

# Excluded (from hermes): search/fetch nav indirection, docs-lookup pair,
# observability beta, Neon Auth provisioning trio.
tools:
  default_excluded:
    - search
    - fetch
    - list_docs_resources
    - get_doc_resource
    - query_logs
    - list_log_fields
    - list_log_field_values
    - provision_neon_auth
    - configure_neon_auth
    - get_neon_auth_config

suggest:
  keywords: [neon, postgres]
  hosts: [neon.tech, neon.com]

post_install: |
  On first connection Freyja opens a browser to authorize with Neon
  (or run `/mcp login neon`). Approve access, then `/mcp enable neon`
  (or `/mcp reload` if already enabled) so the tools load.
