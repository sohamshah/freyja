# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Adapted from hermes-agent optional-mcps/aws-knowledge/manifest.yaml
# (Copyright (c) 2025 Nous Research, MIT License). URL/pins re-verified for
# Freyja on the `verified` date below.
manifest_version: 1

name: aws-knowledge
description: Authoritative AWS docs, API references, and best practices.
homepage: https://awslabs.github.io/mcp/servers/aws-knowledge-mcp-server
license: Apache-2.0
verified: 2026-09-03
tags: [docs, aws, cloud, remote, no-auth]

# Verified live: anonymous POST initialize -> 200, serverInfo AWSKnowledgeMCP.
transport:
  type: http
  url: https://knowledge-mcp.global.api.aws

auth:
  type: none

tools:
  default_excluded:
    - aws___retrieve_skill

suggest:
  keywords: [aws docs, aws knowledge]
  hosts: [aws.amazon.com, docs.aws.amazon.com]

post_install: |
  No account needed — `/mcp enable aws-knowledge` and the tools are live.
