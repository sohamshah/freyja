# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Adapted from hermes-agent optional-mcps/gitlab/manifest.yaml
# (Copyright (c) 2025 Nous Research, MIT License). URL/pins re-verified for
# Freyja on the `verified` date below.
manifest_version: 1

name: gitlab
description: 'GitLab: issues, merge requests, pipelines, and repo context.'
homepage: https://docs.gitlab.com/user/model_context_protocol/mcp_server/
license: proprietary
verified: 2026-09-03
tags: [git, code, ci, remote, oauth]

# Verified live: 401 + resource_metadata=
# https://gitlab.com/.well-known/oauth-protected-resource/api/v4/mcp
transport:
  type: http
  url: https://gitlab.com/api/v4/mcp

auth:
  type: oauth

tools:
  default_excluded:
    - get_mcp_server_version
    - list_duo_sessions

suggest:
  keywords: [gitlab, merge request]
  hosts: [gitlab.com]

post_install: |
  On first connection Freyja opens a browser to authorize with GitLab
  (or run `/mcp login gitlab`). Approve access, then `/mcp enable gitlab`.

  Covers gitlab.com. Self-managed GitLab (18.6+): edit the url in mcp.json
  to https://<your-host>/api/v4/mcp.
