# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Adapted from hermes-agent optional-mcps/vercel/manifest.yaml
# (Copyright (c) 2025 Nous Research, MIT License). URL/pins re-verified for
# Freyja on the `verified` date below.
manifest_version: 1

name: vercel
description: Deployments, logs, and projects via Vercel's hosted MCP.
homepage: https://vercel.com/docs/mcp
license: proprietary
verified: 2026-09-03
tags: [hosting, deploy, remote, oauth]

# Official hosted remote MCP, native OAuth 2.1 + DCR. Verified live: 401 +
# resource_metadata=https://mcp.vercel.com/.well-known/oauth-protected-resource
transport:
  type: http
  url: https://mcp.vercel.com

auth:
  type: oauth

suggest:
  keywords: [vercel]
  hosts: [vercel.com]

post_install: |
  On first connection Freyja opens a browser to authorize with Vercel
  (or run `/mcp login vercel`). Approve access, then `/mcp enable vercel`
  (or `/mcp reload` if already enabled) so the tools load.
