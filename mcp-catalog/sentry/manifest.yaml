# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Adapted from hermes-agent optional-mcps/sentry/manifest.yaml
# (Copyright (c) 2025 Nous Research, MIT License). URL/pins re-verified for
# Freyja on the `verified` date below.
manifest_version: 1

name: sentry
description: Issues, stack traces, and error context from Sentry.
homepage: https://docs.sentry.io/product/sentry-mcp/
license: proprietary
verified: 2026-09-03
tags: [observability, errors, remote, oauth]

# Official hosted remote MCP, native OAuth 2.1 + DCR. Verified live: 401 +
# resource_metadata=https://mcp.sentry.dev/.well-known/oauth-protected-resource
transport:
  type: http
  url: https://mcp.sentry.dev/mcp

auth:
  type: oauth

suggest:
  keywords: [sentry, stack trace, crash report]
  hosts: [sentry.io]

post_install: |
  On first connection Freyja opens a browser to authorize with Sentry
  (or run `/mcp login sentry`). Approve access, then `/mcp enable sentry`
  (or `/mcp reload` if already enabled) so the tools load.
