# Freyja on the `verified` date below.
manifest_version: 1

name: microsoft-learn
description: Official Microsoft, Azure, and .NET docs and code samples.
homepage: https://learn.microsoft.com/en-us/training/support/mcp-get-started
license: proprietary
verified: 2026-09-03
tags: [docs, azure, dotnet, remote, no-auth]

# Verified live: anonymous POST initialize -> 200, serverInfo "Microsoft Learn MCP Server".
transport:
  type: http
  url: https://learn.microsoft.com/api/mcp

auth:
  type: none

suggest:
  keywords: [microsoft docs, azure docs, msdn]
  hosts: [learn.microsoft.com]

post_install: |
  No account needed — `/mcp enable microsoft-learn` and the tools are live.
