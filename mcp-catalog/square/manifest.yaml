# Freyja MCP catalog entry — presence in mcp-catalog/ = reviewed + approved.
# Schema follows hermes-agent's optional-mcps manifest.yaml (Nous Research,
# MIT) with Freyja additions: homepage, license, tags, verified.
manifest_version: 1

name: square
description: Square payments, orders, catalog, customers and bookings via the hosted MCP.
homepage: https://developer.squareup.com/docs/mcp
license: proprietary
verified: 2026-09-03
tags: [payments, commerce, remote, oauth]

# Verified live: 401 + resource_metadata=
# https://mcp.squareup.com/.well-known/oauth-protected-resource/mcp
transport:
  type: http
  url: https://mcp.squareup.com/mcp

auth:
  type: oauth

suggest:
  keywords: [square, squareup]
  hosts: [squareup.com]

post_install: |
  On first connection Freyja opens a browser to authorize with Square
  (or run `/mcp login square`). Approve access, then `/mcp enable square`
  (or `/mcp reload` if already enabled) so the tools load.
